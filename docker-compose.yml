version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: traffic_ai_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: traffic_ai_db
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_ai_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=traffic_ai_db
      - USE_FALLBACK_DB_IF_MONGO_DISCONNECTED=true
    depends_on:
      - mongodb

volumes:
  mongo_data:
